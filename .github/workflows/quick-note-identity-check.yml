name: Quick Note identity verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npm test --
          src/components/AdvancedColorPicker.test.tsx
          src/components/AppearancePicker.test.tsx
          src/components/SettingsQuickNoteEditorDrawer.test.tsx
          src/components/QuickNotes/QuickNotesSettings.test.tsx
      - name: Type-check picker production files
        run: |
          cat > tsconfig.quick-note-picker.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "src/components/AdvancedColorPicker.tsx",
              "src/components/AppearancePicker.tsx"
            ]
          }
          EOF
          npx tsc -p tsconfig.quick-note-picker.json --noEmit
          rm tsconfig.quick-note-picker.json
      - name: Lint changed Quick Note files
        run: >-
          npx biome check
          src/components/AdvancedColorPicker.tsx
          src/components/AdvancedColorPicker.test.tsx
          src/components/AppearancePicker.tsx
          src/components/AppearancePicker.test.tsx
          src/components/SettingsQuickNoteEditorDrawer.test.tsx
          src/components/QuickNotes/QuickNoteFlow.tsx
          src/components/QuickNotes/QuickNotesSettings.tsx
          src/components/QuickNotes/QuickNotesSettings.test.tsx
      - run: npm run build
