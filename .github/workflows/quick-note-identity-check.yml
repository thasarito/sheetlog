name: Quick Note identity verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npm test --
          src/components/AppearancePicker.test.tsx
          src/components/SettingsQuickNoteEditorDrawer.test.tsx
          src/components/QuickNotes/QuickNotesSettings.test.tsx
      - run: npx tsc --noEmit
      - run: npm run lint
