name: Settings Control Center Validation

on:
  push:
    branches:
      - feat/settings-control-center-navigation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-control-center-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused behavior tests
        run: >-
          npm test --
          src/lib/settingsControlCenter.test.ts
          src/components/SettingsControlSection.test.tsx
          src/components/SettingsItemEditorDrawer.test.tsx
          src/components/SettingsQuickNoteEditorDrawer.test.tsx
          src/hooks/useSettingsCollectionMutations.test.tsx
          src/hooks/useReplaceQuickNotesConfig.test.tsx
          src/components/SettingsView.test.tsx
      - name: Changed-file Biome check
        run: >-
          npx biome check
          src/lib/settingsControlCenter.ts
          src/lib/settingsControlCenter.test.ts
          src/hooks/useAccountMutations.ts
          src/hooks/useCategoryMutations.ts
          src/hooks/useQuickNotes.ts
          src/hooks/useSettingsCollectionMutations.test.tsx
          src/hooks/useReplaceQuickNotesConfig.test.tsx
          src/components/SettingsControlSection.tsx
          src/components/SettingsControlSection.test.tsx
          src/components/SettingsItemEditorDrawer.tsx
          src/components/SettingsItemEditorDrawer.test.tsx
          src/components/SettingsQuickNoteEditorDrawer.tsx
          src/components/SettingsQuickNoteEditorDrawer.test.tsx
          src/components/SettingsView.tsx
          src/components/SettingsView.test.tsx
      - name: Settings Control Center typecheck
        run: |
          cat > tsconfig.settings-control-center.tmp.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [
              "vite-env.d.ts",
              "global.d.ts",
              "src/lib/settingsControlCenter.ts",
              "src/lib/settingsControlCenter.test.ts",
              "src/hooks/useAccountMutations.ts",
              "src/hooks/useCategoryMutations.ts",
              "src/hooks/useQuickNotes.ts",
              "src/hooks/useSettingsCollectionMutations.test.tsx",
              "src/hooks/useReplaceQuickNotesConfig.test.tsx",
              "src/components/SettingsControlSection.tsx",
              "src/components/SettingsControlSection.test.tsx",
              "src/components/SettingsItemEditorDrawer.tsx",
              "src/components/SettingsItemEditorDrawer.test.tsx",
              "src/components/SettingsQuickNoteEditorDrawer.tsx",
              "src/components/SettingsQuickNoteEditorDrawer.test.tsx",
              "src/components/SettingsView.tsx",
              "src/components/SettingsView.test.tsx"
            ],
            "exclude": ["node_modules"]
          }
          JSON
          npx tsc -p tsconfig.settings-control-center.tmp.json --noEmit
          rm tsconfig.settings-control-center.tmp.json
      - name: Production build
        run: npm run build
      - name: Full repository typecheck (known baseline check)
        continue-on-error: true
        run: npx tsc --noEmit
