name: Settings Control Center Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-control-center-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add post-touch ownership diagnostics
        run: |
          node scripts/patch-settings-control-center-e2e-diagnostic.mjs
          npx biome check --write e2e/home-carousel.spec.ts
      - name: Commit diagnostic assertions
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add e2e/home-carousel.spec.ts
            git commit -m "test: assert editor ownership after horizontal touch"
            git push origin HEAD:feat/settings-control-center-navigation
          fi
      - run: npx playwright install chromium
      - name: Mobile Control Center ownership diagnostic
        env:
          VITE_DEV_MODE: "true"
          VITE_GOOGLE_MAPS_API_KEY: e2e-key
        run: >-
          npx playwright test e2e/home-carousel.spec.ts
          --project="Mobile Chrome"
          --grep="expandable Control Center"
          --retries=0
