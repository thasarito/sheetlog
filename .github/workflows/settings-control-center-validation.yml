name: Settings Control Center Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-control-center-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add carousel-owner navigation lock regression
        run: |
          node scripts/patch-settings-control-center-e2e-selectors.mjs
          npx biome check --write src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
      - name: Commit red regression
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
            git commit -m "test: define carousel-owner Settings lock"
            git push origin HEAD:feat/settings-control-center-navigation
          fi
      - name: Carousel owner regression (expected red before implementation)
        run: npm test -- src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
