name: Verify full unit test suite

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full Vitest suite and report failures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee full-test.log
          status=${PIPESTATUS[0]}
          perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' full-test.log > full-test-clean.log
          awk '/Failed Tests|Unhandled Errors|Test Files/{capture=1} capture{print}' full-test-clean.log | tail -n 180 > full-test-summary.txt
          if [ ! -s full-test-summary.txt ]; then
            tail -n 180 full-test-clean.log > full-test-summary.txt
          fi
          {
            echo "## Full Vitest verification"
            echo
            echo '```text'
            cat full-test-summary.txt
            echo '```'
          } > full-test-comment.md
          gh pr comment 221 --body-file full-test-comment.md
          exit "$status"
