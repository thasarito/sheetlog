name: Implement PR 166

on:
  push:
    branches:
      - docs/home-settings-carousel-design
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: implement-pr-166
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply the Settings carousel implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              Path(path).write_text(content)

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:120]!r}")
              write(path, content.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count < 1:
                  raise RuntimeError(f"{path}: no matches: {old[:120]!r}")
              write(path, content.replace(old, new))

          header = '''import {
            forwardRef,
            useCallback,
            useEffect,
            useImperativeHandle,
            useLayoutEffect,
            useRef,
          } from "react";
          import {
            DashboardTitleReel,
            type DashboardTitleReelHandle,
          } from "./DashboardTitleReel";

          type HeaderProps = {
            overlayDashboard?: boolean;
          };

          export type DashboardHeaderMotionHandle = {
            setHorizontalMotion: (settledIndex: number, progress: number) => void;
            setVerticalProgress: (progress: number) => void;
          };

          function clampProgress(progress: number): number {
            return Math.min(1, Math.max(0, progress));
          }

          export const Header = forwardRef<DashboardHeaderMotionHandle, HeaderProps>(
            function Header({ overlayDashboard = false }, forwardedRef) {
              const headerRef = useRef<HTMLDivElement>(null);
              const titleReelRef = useRef<DashboardTitleReelHandle>(null);
              const verticalProgressRef = useRef(0);

              const setVerticalProgress = useCallback((incomingProgress: number) => {
                const header = headerRef.current;
                if (!header) return;
                const progress = clampProgress(incomingProgress);
                verticalProgressRef.current = progress;
                const height = header.getBoundingClientRect().height || 68;
                header.style.transform = `translate3d(0, ${(-height * progress).toFixed(2)}px, 0)`;
                header.style.opacity = String(1 - progress);
                header.style.pointerEvents = progress > 0.96 ? "none" : "auto";
                header.dataset.hideProgress = progress.toFixed(3);
              }, []);

              useImperativeHandle(
                forwardedRef,
                () => ({
                  setHorizontalMotion(settledIndex, progress) {
                    titleReelRef.current?.setHorizontalMotion(settledIndex, progress);
                  },
                  setVerticalProgress,
                }),
                [setVerticalProgress],
              );

              useLayoutEffect(() => {
                setVerticalProgress(verticalProgressRef.current);
                const header = headerRef.current;
                if (!header || typeof ResizeObserver === "undefined") return;
                const observer = new ResizeObserver(() =>
                  setVerticalProgress(verticalProgressRef.current),
                );
                observer.observe(header);
                return () => observer.disconnect();
              }, [setVerticalProgress]);

              useEffect(() => {
                if (!overlayDashboard) setVerticalProgress(0);
              }, [overlayDashboard, setVerticalProgress]);

              return (
                <header
                  className={`${overlayDashboard ? "absolute inset-x-0 top-0" : "relative shrink-0"} pointer-events-none h-[68px] w-full`}
                >
                  <div
                    ref={headerRef}
                    data-testid="dashboard-header"
                    data-hide-progress="0.000"
                    className="pointer-events-auto relative z-30 h-full w-full bg-background/95 [will-change:transform,opacity]"
                    style={{ transform: "translate3d(0, 0.00px, 0)", opacity: 1 }}
                  >
                    <DashboardTitleReel ref={titleReelRef} />
                  </div>
                </header>
              );
            },
          );
          '''
          write("src/components/Header.tsx", header)

          replace_once(
              "src/components/DashboardTitleReel.tsx",
              'const LABELS = ["Analytics", "Transactions"] as const;',
              'const LABELS = ["Analytics", "Transactions", "Settings"] as const;',
          )
          replace_once(
              "src/components/DashboardTitleReel.tsx",
              'className="pointer-events-none absolute inset-y-0 left-3 right-[66px] min-w-0 select-none overflow-hidden"',
              'className="pointer-events-none absolute inset-y-0 left-3 right-3 min-w-0 select-none overflow-hidden"',
          )

          carousel = "src/components/TransactionFlow/HomeDashboardCarousel.tsx"
          replace_once(
              carousel,
              'import type { DashboardHeaderMotionHandle } from "../Header";',
              'import type { DashboardHeaderMotionHandle } from "../Header";\nimport { SettingsView } from "../SettingsDrawer";',
          )
          replace_once(
              carousel,
              'const SLIDES = ["Analytics", "Transactions"] as const;',
              'const SLIDES = ["Analytics", "Transactions", "Settings"] as const;',
          )
          replace_once(
              carousel,
              '  const verticalProgressRef = useRef([0, 0]);',
              '  const verticalProgressRef = useRef<number[]>(SLIDES.map(() => 0));',
          )
          replace_once(
              carousel,
              '''      headerMotionRef?.current?.setVerticalProgress(
                verticalProgressRef.current[index] ?? 0,
              );
              renderTransactionDockMotion(index === 1, false);''',
              '''      const verticalProgress = verticalProgressRef.current[index] ?? 0;
              headerMotionRef?.current?.setVerticalProgress(verticalProgress);
              slideRefs.current[index]?.style.setProperty(
                "--dashboard-visible-header-height",
                `${HEADER_COLLAPSE_DISTANCE * (1 - verticalProgress)}px`,
              );
              renderTransactionDockMotion(index === 1, false);''',
          )
          replace_once(
              carousel,
              '''    verticalProgressRef.current[index] = progress;
              if (index === activeIndexRef.current) {''',
              '''    verticalProgressRef.current[index] = progress;
              slide?.style.setProperty(
                "--dashboard-visible-header-height",
                `${HEADER_COLLAPSE_DISTANCE * (1 - progress)}px`,
              );
              if (index === activeIndexRef.current) {''',
          )
          replace_all(carousel, 'slide 1 of 2', 'slide 1 of 3')
          replace_all(carousel, 'slide 2 of 2', 'slide 2 of 3')
          replace_once(
              carousel,
              '''          </section>
                </div>
              </div>

              <p className="sr-only" aria-live="polite">''',
              '''          </section>
                  <section
                    ref={(node) => {
                      slideRefs.current[2] = node;
                    }}
                    aria-label="Settings, slide 3 of 3"
                    aria-hidden={activeIndex !== 2}
                    data-home-carousel-slide-index="2"
                    className="h-full min-w-0 flex-[0_0_100%]"
                  >
                    <SettingsView onToast={onToast} analyticsSync={analyticsSync} />
                  </section>
                </div>
              </div>

              <p className="sr-only" aria-live="polite">''',
          )

          replace_once(
              "src/components/TransactionFlow/index.tsx",
              '''        <Header
                  ref={dashboardHeaderMotionRef}
                  showSettings
                  overlayDashboard={step === 0}
                  onToast={handleToast}
                  analyticsSync={analyticsSync}
                />''',
              '''        <Header
                  ref={dashboardHeaderMotionRef}
                  overlayDashboard={step === 0}
                />''',
          )

          settings = "src/components/SettingsDrawer.tsx"
          replace_once(
              settings,
              '''type SettingsDrawerProps = {
            open: boolean;
            onOpenChange: (open: boolean) => void;
            onToast: (message: string) => void;
            analyticsSync: Pick<
              AnalyticsSyncController,
              'status' | 'lastSyncedAt' | 'isResyncing' | 'resync'
            >;
          };''',
              '''export type SettingsViewProps = {
            onToast: (message: string) => void;
            analyticsSync: Pick<
              AnalyticsSyncController,
              'status' | 'lastSyncedAt' | 'isResyncing' | 'resync'
            >;
          };

          type SettingsDrawerProps = SettingsViewProps & {
            open: boolean;
            onOpenChange: (open: boolean) => void;
            mode?: 'drawer' | 'inline';
          };''',
          )
          replace_once(
              settings,
              '''  useLayoutEffect(() => {
              const top = scrollPositions.current.get(screenKey);
              if (typeof top === 'number') {
                const el = ref.current;
                if (el) el.scrollTop = top;
              }

              return () => {''',
              '''  useLayoutEffect(() => {
              const el = ref.current;
              const top = scrollPositions.current.get(screenKey) ?? 0;
              if (el) {
                el.scrollTop = top;
                el.dispatchEvent(new Event('scroll', { bubbles: true }));
              }

              return () => {''',
          )
          replace_once(
              settings,
              '<div ref={ref} className="h-full overflow-y-auto pb-safe">',
              '''<div
                ref={ref}
                data-testid={`settings-scroll-${screenKey}`}
                data-dashboard-scroll="true"
                className="h-full overflow-y-auto pb-safe"
              >''',
          )
          replace_once(
              settings,
              '''            type="button"
                        onPointerDown={handlePointerDown}''',
              '''            type="button"
                        data-home-carousel-swipe-lock="true"
                        onPointerDown={handlePointerDown}''',
          )
          replace_once(
              settings,
              '''export function SettingsDrawer({
            open,
            onOpenChange,
            onToast,
            analyticsSync,
          }: SettingsDrawerProps) {
            const { isOnline } = useConnectivity();''',
              '''export function SettingsDrawer({
            open,
            onOpenChange,
            onToast,
            analyticsSync,
            mode = 'drawer',
          }: SettingsDrawerProps) {
            const inline = mode === 'inline';
            const { isOnline } = useConnectivity();''',
          )
          replace_once(
              settings,
              '''  // Close on Escape; pop if nested
            useEffect(() => {
              if (!open) return;''',
              '''  // Close on Escape; pop if nested. Inline Settings leaves Escape to the page.
            useEffect(() => {
              if (!open || inline) return;''',
          )
          replace_once(
              settings,
              '  }, [open, onOpenChange, quickNoteEditMode.isOpen, stack.length]);',
              '  }, [inline, open, onOpenChange, quickNoteEditMode.isOpen, stack.length]);',
          )
          replace_once(
              settings,
              '''  // Lock background scroll while open
            useEffect(() => {
              if (!open) return;''',
              '''  // Lock background scroll only for the legacy drawer shell.
            useEffect(() => {
              if (!open || inline) return;''',
          )
          replace_once(settings, '  }, [open]);\n\n  // Focus inputs', '  }, [inline, open]);\n\n  // Focus inputs')
          replace_once(
              settings,
              '''  // Reset when closing
            useEffect(() => {
              if (open) return;
              resetEphemeralState();
            }, [open, resetEphemeralState]);''',
              '''  // Reset only when the legacy drawer closes. Inline Settings stays mounted.
            useEffect(() => {
              if (inline || open) return;
              resetEphemeralState();
            }, [inline, open, resetEphemeralState]);''',
          )
          replace_once(
              settings,
              '''          <motion.div
                    className="fixed inset-0 z-40"
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                  >''',
              '''          <motion.div
                    data-testid={inline ? 'settings-view' : undefined}
                    className={inline ? 'relative h-full min-h-0 bg-surface' : 'fixed inset-0 z-40'}
                    initial={inline ? false : { opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={inline ? undefined : { opacity: 0 }}
                  >''',
          )
          replace_once(
              settings,
              '''            <button
                      type="button"
                      aria-label="Close settings"
                      className="absolute inset-0 bg-overlay/40 backdrop-blur-[2px]"
                      onClick={() => onOpenChange(false)}
                    />''',
              '''            {!inline ? (
                      <button
                        type="button"
                        aria-label="Close settings"
                        className="absolute inset-0 bg-overlay/40 backdrop-blur-[2px]"
                        onClick={() => onOpenChange(false)}
                      />
                    ) : null}''',
          )
          replace_once(
              settings,
              '''            <motion.div
                      className="absolute inset-x-0 bottom-0 h-[80vh] overflow-hidden rounded-t-[28px] border border-border bg-surface"
                      initial={{ y: '100%' }}
                      animate={{ y: 0 }}
                      exit={{ y: '100%' }}
                      transition={{ type: 'spring', stiffness: 420, damping: 45 }}
                    >''',
              '''            <motion.div
                      className={
                        inline
                          ? 'h-full min-h-0 overflow-hidden bg-surface'
                          : 'absolute inset-x-0 bottom-0 h-[80vh] overflow-hidden rounded-t-[28px] border border-border bg-surface'
                      }
                      initial={inline ? false : { y: '100%' }}
                      animate={{ y: 0 }}
                      exit={inline ? undefined : { y: '100%' }}
                      transition={inline ? undefined : { type: 'spring', stiffness: 420, damping: 45 }}
                    >''',
          )
          replace_once(
              settings,
              '              <div className="mx-auto mt-3 h-1.5 w-12 rounded-full bg-border" />',
              '''              {!inline ? (
                        <div className="mx-auto mt-3 h-1.5 w-12 rounded-full bg-border" />
                      ) : null}''',
          )
          replace_once(
              settings,
              '''                {/* iOS-style navigation bar */}
                          <div className="sticky top-0 z-10 border-b border-border/60 bg-surface/90 backdrop-blur">''',
              '''                {/* iOS-style navigation bar */}
                          {!inline || currentScreen.screen !== 'main' ? (
                            <div
                              className="sticky top-0 z-10 border-b border-border/60 bg-surface/90 backdrop-blur"
                              style={
                                inline
                                  ? { marginTop: 'var(--dashboard-visible-header-height, 68px)' }
                                  : undefined
                              }
                            >''',
          )
          replace_once(
              settings,
              '''                    </div>
                          </div>

                          <div className="relative flex-1 overflow-hidden">''',
              '''                    </div>
                            </div>
                          ) : null}

                          <div
                            className="relative flex-1 overflow-hidden"
                            style={
                              inline && currentScreen.screen === 'main'
                                ? { marginTop: 'var(--dashboard-visible-header-height, 68px)' }
                                : undefined
                            }
                          >''',
          )
          replace_once(
              settings,
              '''                        {currentScreen.screen === 'main' ? (
                                      <button
                                        type="button"
                                        onClick={() => onOpenChange(false)}
                                        className="rounded-full px-3 py-1 text-[17px] font-semibold text-primary active:bg-surface-2"
                                      >
                                        Done
                                      </button>
                                    ) : currentScreen.screen === 'accounts' ? (''',
              '''                        {currentScreen.screen === 'main' ? (
                                      inline ? (
                                        <div className="w-12" />
                                      ) : (
                                        <button
                                          type="button"
                                          onClick={() => onOpenChange(false)}
                                          className="rounded-full px-3 py-1 text-[17px] font-semibold text-primary active:bg-surface-2"
                                        >
                                          Done
                                        </button>
                                      )
                                    ) : currentScreen.screen === 'accounts' ? (''',
          )
          replace_once(
              settings,
              '''      {quickNoteEditMode.isOpen &&
                (currentScreen.screen === 'quickNotes' ||
                  currentScreen.screen === 'defaultQuickNotes') && (
                <QuickNoteFlow
                  note={quickNoteEditMode.note}
                  onSave={handleSaveQuickNote}
                  onCancel={handleCloseQuickNoteEdit}
                  onDelete={handleDeleteQuickNote}
                  transactionType={currentScreen.categoryType}
                />
              )}
            </>
          );
          }''',
              '''      {quickNoteEditMode.isOpen &&
                (currentScreen.screen === 'quickNotes' ||
                  currentScreen.screen === 'defaultQuickNotes') && (
                <div data-home-carousel-swipe-lock="true">
                  <QuickNoteFlow
                    note={quickNoteEditMode.note}
                    onSave={handleSaveQuickNote}
                    onCancel={handleCloseQuickNoteEdit}
                    onDelete={handleDeleteQuickNote}
                    transactionType={currentScreen.categoryType}
                  />
                </div>
              )}
            </>
          );
          }

          export function SettingsView({ onToast, analyticsSync }: SettingsViewProps) {
            return (
              <SettingsDrawer
                open
                mode="inline"
                onOpenChange={() => undefined}
                onToast={onToast}
                analyticsSync={analyticsSync}
              />
            );
          }''',
          )

          replace_once(
              "src/components/SwipeableListItem.tsx",
              '    <div className="relative overflow-hidden">',
              '    <div data-home-carousel-swipe-lock="true" className="relative overflow-hidden">',
          )

          header_test = '''import { act, createRef } from "react";
          import { render, screen } from "@testing-library/react";
          import { describe, expect, it } from "vitest";
          import { Header, type DashboardHeaderMotionHandle } from "./Header";

          function reelX(element: HTMLElement): number {
            const match = element.style.transform.match(
              /translate3d\\((-?[\\d.]+)px,\\s*-50%,\\s*0(?:px)?\\)/,
            );
            if (!match) throw new Error(`Missing reel transform: ${element.style.transform}`);
            return Number(match[1]);
          }

          function measuredWidth(element: HTMLElement): number {
            if (element.textContent === "Transactions") return 118;
            if (element.textContent === "Settings") return 78;
            return 82;
          }

          describe("Header dashboard title reel", () => {
            it("renders a passive Analytics-first three-label reel without Settings chrome", () => {
              render(<Header />);

              const reel = screen.getByTestId("dashboard-title-reel");
              expect(reel).toHaveAttribute("aria-hidden", "true");
              expect(reel).not.toHaveAttribute("tabindex");
              expect(reel).toHaveClass("pointer-events-none");
              expect(screen.queryByRole("button", { name: "Open settings" })).not.toBeInTheDocument();
              expect(screen.queryByRole("button", { name: "Close settings" })).not.toBeInTheDocument();

              const items = screen.getAllByTestId("dashboard-title-reel-item");
              expect(items).toHaveLength(5);
              expect(items.find((item) => item.dataset.offset === "0")).toHaveTextContent(
                "Analytics",
              );
              expect(items.find((item) => item.dataset.offset === "1")).toHaveTextContent(
                "Transactions",
              );
              expect(items.find((item) => item.dataset.offset === "2")).toHaveTextContent(
                "Settings",
              );
            });

            it("keeps one measured gap while the three-label reel follows signed motion", () => {
              const motionRef = createRef<DashboardHeaderMotionHandle>();
              render(<Header ref={motionRef} />);

              const reel = screen.getByTestId("dashboard-title-reel");
              Object.defineProperty(reel, "clientWidth", {
                configurable: true,
                value: 300,
              });
              const items = screen.getAllByTestId("dashboard-title-reel-item");
              for (const item of items) {
                item.getBoundingClientRect = () =>
                  ({
                    width: measuredWidth(item),
                    height: 27,
                    x: 0,
                    y: 0,
                    top: 0,
                    right: measuredWidth(item),
                    bottom: 27,
                    left: 0,
                    toJSON: () => ({}),
                  }) as DOMRect;
              }

              act(() => motionRef.current?.setHorizontalMotion(0, 0.4));

              expect(reel).toHaveAttribute("data-direction", "forward");
              expect(Number(reel.dataset.progress)).toBeCloseTo(0.4, 3);
              const forwardItems = items
                .filter((item) => item.style.visibility !== "hidden")
                .sort((left, right) => reelX(left) - reelX(right));
              expect(forwardItems.map((item) => item.textContent)).toEqual([
                "Analytics",
                "Transactions",
                "Settings",
              ]);
              const forwardGaps = forwardItems.slice(1).map((item, index) => {
                const previous = forwardItems[index];
                return reelX(item) - reelX(previous) - measuredWidth(previous);
              });
              expect(forwardGaps[0]).toBeCloseTo(forwardGaps[1], 2);
              expect(forwardGaps[0]).toBeCloseTo(Number(reel.dataset.gap), 2);

              act(() => motionRef.current?.setHorizontalMotion(0, -0.4));
              expect(reel).toHaveAttribute("data-direction", "backward");
              expect(Number(reel.dataset.progress)).toBeCloseTo(-0.4, 3);
            });

            it("hides the complete top bar in proportion to active content scroll", () => {
              const motionRef = createRef<DashboardHeaderMotionHandle>();
              render(<Header ref={motionRef} />);
              const header = screen.getByTestId("dashboard-header");
              header.getBoundingClientRect = () =>
                ({
                  width: 390,
                  height: 68,
                  x: 0,
                  y: 0,
                  top: 0,
                  right: 390,
                  bottom: 68,
                  left: 0,
                  toJSON: () => ({}),
                }) as DOMRect;

              act(() => motionRef.current?.setVerticalProgress(0.5));

              expect(header).toHaveAttribute("data-hide-progress", "0.500");
              expect(header.style.transform).toBe("translate3d(0, -34.00px, 0)");
              expect(header.style.opacity).toBe("0.5");
            });
          });
          '''
          write("src/components/Header.test.tsx", header_test)

          carousel_test = "src/components/TransactionFlow/HomeDashboardCarousel.test.tsx"
          replace_once(
              carousel_test,
              "import type { DashboardHeaderMotionHandle } from '../Header';",
              "import type { DashboardHeaderMotionHandle } from '../Header';\nimport type { SettingsViewProps } from '../SettingsDrawer';",
          )
          replace_once(
              carousel_test,
              '  slideOffsets: [0, 300] as [number, number],',
              '  slideOffsets: [0, 300, 600] as [number, number, number],',
          )
          replace_once(
              carousel_test,
              '''          selected = (next + 2) % 2;
                    emblaHarness.slideOffsets =
                      selected === 0 ? [0, 300] : [-300, 0];''',
              '''          selected = (next + 3) % 3;
                    emblaHarness.slideOffsets =
                      selected === 0
                        ? [0, 300, 600]
                        : selected === 1
                          ? [-300, 0, 300]
                          : [-600, -300, 0];''',
          )
          replace_once(carousel_test, 'previousScrollSnap: () => (selected + 1) % 2,', 'previousScrollSnap: () => (selected + 2) % 3,')
          replace_once(carousel_test, 'scrollSnapList: () => [0, 1],', 'scrollSnapList: () => [0, 1, 2],')
          replace_once(carousel_test, 'slidesNotInView: () => [(selected + 1) % 2],', 'slidesNotInView: () => [0, 1, 2].filter((index) => index !== selected),')
          replace_once(
              carousel_test,
              '''const transactionViewCalls: TransactionHistoryViewProps[] = [];
          const analyticsViewCalls: AnalyticsViewProps[] = [];''',
              '''const transactionViewCalls: TransactionHistoryViewProps[] = [];
          const analyticsViewCalls: AnalyticsViewProps[] = [];
          const settingsViewCalls: SettingsViewProps[] = [];''',
          )
          analytics_mock_end = '''vi.mock('./AnalyticsView', () => ({
            AnalyticsView: (props: AnalyticsViewProps) => {
              analyticsViewCalls.push(props);'''
          if analytics_mock_end not in read(carousel_test):
              raise RuntimeError("Analytics mock anchor missing")
          settings_mock = '''

          vi.mock('../SettingsDrawer', () => ({
            SettingsView: (props: SettingsViewProps) => {
              settingsViewCalls.push(props);
              return (
                <section data-testid="settings-scroll" data-dashboard-scroll="true">
                  <span>Full Settings view</span>
                  <input aria-label="Settings draft" defaultValue="" />
                </section>
              );
            },
          }));
          '''
          anchor = '\n\nfunction renderCarousel({'
          content = read(carousel_test)
          if anchor not in content:
              raise RuntimeError("renderCarousel anchor missing")
          write(carousel_test, content.replace(anchor, settings_mock + anchor, 1))
          replace_all(carousel_test, 'Analytics, slide 1 of 2', 'Analytics, slide 1 of 3')
          replace_all(carousel_test, 'Transactions, slide 2 of 2', 'Transactions, slide 2 of 3')
          replace_all(carousel_test, 'emblaHarness.slideOffsets = [0, 300];', 'emblaHarness.slideOffsets = [0, 300, 600];')
          replace_all(carousel_test, 'emblaHarness.slideOffsets = [-175, 125];', 'emblaHarness.slideOffsets = [-175, 125, 425];')
          replace_all(carousel_test, 'emblaHarness.slideOffsets = [175, -125];', 'emblaHarness.slideOffsets = [175, -125, 475];')
          replace_all(carousel_test, 'emblaHarness.slideOffsets = [-440, -140];', 'emblaHarness.slideOffsets = [-440, -140, 160];')
          replace_all(carousel_test, 'emblaHarness.slideOffsets = [-300, 0];', 'emblaHarness.slideOffsets = [-300, 0, 300];')
          replace_once(
              carousel_test,
              '''async function openTransactions() {
            fireEvent.keyDown(screen.getByTestId('home-carousel-viewport'), {
              key: 'ArrowRight',
            });
            await waitFor(() =>
              expect(
                screen.getByLabelText('Transactions, slide 2 of 3'),
              ).not.toHaveAttribute('aria-hidden', 'true'),
