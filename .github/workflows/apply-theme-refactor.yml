name: Export audited SheetLog base

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-base:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audited base
        uses: actions/checkout@v4
        with:
          ref: 5561b67c2cd2ab1a57b6fbf8700d29b1b8634ae3

      - name: Package working tree
        shell: bash
        run: tar --exclude=.git -czf /tmp/sheetlog-base.tar.gz .

      - name: Upload pristine base
        uses: actions/upload-artifact@v4
        with:
          name: sheetlog-audited-base
          path: /tmp/sheetlog-base.tar.gz
          if-no-files-found: error
          retention-days: 1
