name: Diagnose category sheet baseline

on:
  pull_request:
    branches:
      - main

concurrency:
  group: transaction-sync-settings-baseline
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out untouched main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run category sheet files together on main
        continue-on-error: true
        run: |
          npm test -- \
            src/components/TransactionFlow/CategoryStepSheet.test.tsx \
            src/components/TransactionFlow/CategoryStepSheetKeyboard.test.tsx

      - name: Run keyboard file alone on main
        continue-on-error: true
        run: npm test -- src/components/TransactionFlow/CategoryStepSheetKeyboard.test.tsx

      - name: Run category sheet file alone on main
        run: npm test -- src/components/TransactionFlow/CategoryStepSheet.test.tsx
