name: Implement transaction sync relocation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: transaction-sync-settings-implementation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/transaction-sync-settings
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Implement approved relocation
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"Expected {expected} match(es) in {path}, found {count}: {old[:120]!r}"
                  )
              file.write_text(text.replace(old, new))

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}: {pattern!r}")
              file.write_text(updated)

          Path('src/components/AnalyticsSyncSetting.tsx').write_text(
              textwrap.dedent(
                  '''\
                  import { format } from 'date-fns';
                  import { RefreshCw } from 'lucide-react';
                  import { tryParseDate } from '../lib/date-utils';
                  import type { AnalyticsSyncStatus } from './TransactionFlow/useAnalyticsSync';

                  type AnalyticsSyncSettingProps = {
                    count: number;
                    capturedAt?: string;
                    status: AnalyticsSyncStatus;
                    isRefreshing: boolean;
                    isDownloading: boolean;
                    hasLocalHistory: boolean;
                    isResyncing: boolean;
                    onResync: () => void;
                  };

                  function transactionCountLabel(count: number): string {
                    return `${count} ${count === 1 ? 'transaction' : 'transactions'}`;
                  }

                  function lastSavedLabel(capturedAt?: string): string | null {
                    if (!capturedAt) return null;
                    const timestamp = tryParseDate(capturedAt);
                    return timestamp
                      ? `Last saved ${format(timestamp, 'MMM d, HH:mm')}`
                      : null;
                  }

                  function statusLabel({
                    capturedAt,
                    status,
                    isRefreshing,
                    isDownloading,
                    hasLocalHistory,
                    isResyncing,
                  }: Omit<AnalyticsSyncSettingProps, 'count' | 'onResync'>): string {
                    const saved = lastSavedLabel(capturedAt);
                    if (isDownloading) return 'Downloading…';
                    if (isResyncing || isRefreshing || status === 'syncing') return 'Updating…';
                    if (status === 'offline') {
                      return saved ? `Offline · ${saved}` : 'Offline · Not downloaded';
                    }
                    if (!hasLocalHistory || !saved) return 'Not downloaded';
                    return saved;
                  }

                  export function AnalyticsSyncSetting({
                    count,
                    capturedAt,
                    status,
                    isRefreshing,
                    isDownloading,
                    hasLocalHistory,
                    isResyncing,
                    onResync,
                  }: AnalyticsSyncSettingProps) {
                    const busy =
                      isResyncing || isRefreshing || isDownloading || status === 'syncing';

                    return (
                      <div
                        data-testid="transaction-history-sync-setting"
                        className="flex min-h-16 items-center gap-3 px-4 py-3"
                      >
                        <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-[9px] bg-[#5856D6] text-white">
                          <RefreshCw
                            className={`h-4 w-4 ${busy ? 'animate-spin motion-reduce:animate-none' : ''}`}
                            aria-hidden="true"
                          />
                        </div>
                        <div className="min-w-0 flex-1">
                          <p className="truncate text-[17px] text-foreground">Transaction history</p>
                          <p className="truncate text-[13px] text-muted-foreground">
                            {transactionCountLabel(count)}
                          </p>
                          <p
                            className="truncate text-[13px] text-muted-foreground"
                            aria-live="polite"
                          >
                            {statusLabel({
                              capturedAt,
                              status,
                              isRefreshing,
                              isDownloading,
                              hasLocalHistory,
                              isResyncing,
                            })}
                          </p>
                        </div>
                        <button
                          type="button"
                          onClick={onResync}
                          disabled={busy || status === 'offline'}
                          aria-label="Resync transaction history"
                          aria-busy={busy}
                          className="min-h-11 rounded-[10px] border border-border bg-surface px-3 text-[13px] font-semibold text-primary active:bg-surface-2 disabled:opacity-50"
                        >
                          Resync
                        </button>
                      </div>
                    );
                  }
                  '''
              )
          )

          replace_exact(
              'src/components/SettingsView.tsx',
              "    'status' | 'lastSyncedAt' | 'isResyncing' | 'resync'\n",
              "    'status' | 'isResyncing' | 'resync' | 'records' | 'hasLocalHistory' | 'history'\n",
          )
          replace_exact(
              'src/components/SettingsView.tsx',
              '''          />
          {hasSettingsDiagnostics ? (''',
              '''          />
          <div className="ml-[56px] h-px bg-border/70" />
          <AnalyticsSyncSetting
            count={analyticsSync.records.length}
            capturedAt={analyticsSync.history.meta?.capturedAt}
            status={analyticsSync.status}
            isRefreshing={analyticsSync.history.isRefreshing}
            isDownloading={analyticsSync.history.isDownloading}
            hasLocalHistory={analyticsSync.hasLocalHistory}
            isResyncing={analyticsSync.isResyncing}
            onResync={analyticsSync.resync}
          />
          {hasSettingsDiagnostics ? (''',
          )
          replace_exact(
              'src/components/SettingsView.tsx',
              '''          <div className="ml-[56px] h-px bg-border/70" />
          <AnalyticsSyncSetting
            status={analyticsSync.status}
            lastSyncedAt={analyticsSync.lastSyncedAt}
            isResyncing={analyticsSync.isResyncing}
            onResync={analyticsSync.resync}
          />
          <div className="ml-[56px] h-px bg-border/70" />''',
              '''          <div className="ml-[56px] h-px bg-border/70" />''',
          )

          replace_exact(
              'src/components/TransactionFlow/TransactionHistoryDock.tsx',
              'import { RefreshCw, Search, X } from "lucide-react";',
              'import { Search, X } from "lucide-react";',
          )
          replace_exact(
              'src/components/TransactionFlow/TransactionHistoryDock.tsx',
              '''  countLabel: string;
          statusLabel: string;
          canRefresh: boolean;
          isRefreshing: boolean;
          onRefresh: () => void;
          '''.replace('          ', ''),
              '',
          )
          replace_exact(
              'src/components/TransactionFlow/TransactionHistoryDock.tsx',
              '''  countLabel,
          statusLabel,
          canRefresh,
          isRefreshing,
          onRefresh,
          '''.replace('          ', ''),
              '',
          )
          replace_regex(
              'src/components/TransactionFlow/TransactionHistoryDock.tsx',
              r'''\n      <div\n        data-testid="transaction-history-metadata".*?\n      </div>\n    </div>\n  \);''',
              '\n    </div>\n  );',
          )

          replace_exact(
              'src/components/TransactionFlow/CategoryStepSheetAccessory.tsx',
              'export const DEFAULT_TRANSACTION_HISTORY_DOCK_HEIGHT = 104;',
              'export const DEFAULT_TRANSACTION_HISTORY_DOCK_HEIGHT = 60;',
          )

          replace_exact(
              'src/components/TransactionFlow/TransactionHistoryView.tsx',
              'import { format } from "date-fns";\n',
              '',
          )
          replace_exact(
              'src/components/TransactionFlow/TransactionHistoryView.tsx',
              'import { parseDate } from "../../lib/date-utils";\n',
              '',
          )
          replace_exact(
              'src/components/TransactionFlow/TransactionHistoryView.tsx',
              '''  const countLabel = `${filteredTransactions.length} ${
            filteredTransactions.length === 1 ? "transaction" : "transactions"
          }`;
          '''.replace('          ', ''),
              '',
          )
          replace_exact(
              'src/components/TransactionFlow/TransactionHistoryView.tsx',
              '  const isRefreshing = history.isRefreshing || baseAmounts.isRefreshing;\n',
              '',
          )
          replace_regex(
              'src/components/TransactionFlow/TransactionHistoryView.tsx',
              r'''\n  const statusLabel = isRefreshing\n    \? "Updating…"\n    : history\.meta\n      \? `Saved \$\{format\(parseDate\(history\.meta\.capturedAt\), "MMM d, HH:mm"\)\}`\n      : history\.isDownloading\n        \? "Downloading…"\n        : "Not downloaded";''',
              '',
          )
          replace_exact(
              'src/components/TransactionFlow/TransactionHistoryView.tsx',
              '''          countLabel={countLabel}
          statusLabel={statusLabel}
          canRefresh={history.isOnline && !isRefreshing}
          isRefreshing={isRefreshing}
          onRefresh={refresh}
          '''.replace('          ', ''),
              '',
          )
          PY

      - name: Format changed files
        run: |
          npx biome check --write \
            src/components/AnalyticsSyncSetting.tsx \
            src/components/SettingsView.tsx \
            src/components/TransactionFlow/TransactionHistoryDock.tsx \
            src/components/TransactionFlow/TransactionHistoryView.tsx \
            src/components/TransactionFlow/CategoryStepSheetAccessory.tsx

      - name: Run focused tests
        run: |
          npm test -- \
            src/components/AnalyticsSyncSetting.test.tsx \
            src/components/SettingsView.test.tsx \
            src/components/TransactionFlow/TransactionHistoryView.test.tsx

      - name: Run full test suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run production build
        run: npm run build

      - name: Commit and push implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/AnalyticsSyncSetting.tsx \
            src/components/SettingsView.tsx \
            src/components/TransactionFlow/TransactionHistoryDock.tsx \
            src/components/TransactionFlow/TransactionHistoryView.tsx \
            src/components/TransactionFlow/CategoryStepSheetAccessory.tsx
          git commit -m "refactor: move transaction sync details to settings"
          git fetch origin refactor/transaction-sync-settings
          git rebase origin/refactor/transaction-sync-settings
          git push origin HEAD:refactor/transaction-sync-settings
