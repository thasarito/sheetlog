name: Settings Identity Consistency Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-control-center-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add identity consistency regressions
        run: |
          node scripts/patch-settings-identity-consistency.mjs
          npx biome check --write src/components/SettingsView.test.tsx
      - name: Commit red tests
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/SettingsView.test.tsx
            git commit -m "test: cover Settings identity consistency"
            git push origin HEAD:feat/settings-control-center-navigation
          fi
      - name: Identity consistency regressions (expected red)
        run: >-
          npm test -- src/components/SettingsView.test.tsx
          --reporter=verbose
