name: Verify transaction search iOS keyboard clearance

on:
  push:
    branches:
      - fix/transaction-search-ios-keyboard-clearance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression tests
        run: >-
          npx vitest run
          src/components/TransactionFlow/keyboardAccessoryClearance.test.ts
          src/components/TransactionFlow/CategoryStepSheet.keyboardClearance.test.tsx
          src/components/TransactionFlow/useKeyboardViewportState.test.tsx

      - name: Typecheck changed production files
        run: |
          cat > tsconfig.transaction-search.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "noEmit": true
            },
            "include": [
              "src/components/TransactionFlow/keyboardAccessoryClearance.ts",
              "src/components/TransactionFlow/useKeyboardViewportState.ts"
            ]
          }
          JSON
          npx tsc --noEmit --project tsconfig.transaction-search.json
          rm tsconfig.transaction-search.json

      - name: Report repository-wide typecheck baseline
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Lint changed files
        run: >-
          npx biome check
          src/components/TransactionFlow/keyboardAccessoryClearance.ts
          src/components/TransactionFlow/keyboardAccessoryClearance.test.ts
          src/components/TransactionFlow/useKeyboardViewportState.ts
          src/components/TransactionFlow/CategoryStepSheet.keyboardClearance.test.tsx

      - name: Report repository-wide lint baseline
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
