name: Analytics validation cleanup

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.head_ref == 'ci/analytics-motion-check-167'
    runs-on: ubuntu-latest
    steps:
      - name: Close validation pull request and delete branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --delete-branch
