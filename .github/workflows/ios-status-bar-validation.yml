name: iOS Status Bar Validation

on:
  push:
    branches:
      - fix/transparent-ios-status-bar

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Status bar regression
        run: npm test -- src/theme/themeBoundaries.test.ts --reporter=verbose
