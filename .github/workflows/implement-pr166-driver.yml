name: Implement PR 166 Driver

on:
  push:
    branches:
      - docs/home-settings-carousel-design

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: implement-pr-166
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and apply implementation
        id: apply
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/implement-pr166.yml').read_text()
          match = re.search(
              r"(?ms)^\s+python <<'PY'\n(?P<body>.*?)^\s+PY\s*$",
              source,
          )
          if not match:
              raise SystemExit('Could not extract PR 166 implementation script')
          Path('/tmp/apply-pr166.py').write_text(textwrap.dedent(match.group('body')))
          PY
          python /tmp/apply-pr166.py

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Format implementation
        id: format
        shell: bash
        run: |
          changed=$(git diff --name-only -- '*.ts' '*.tsx')
          npx biome check --write $changed
          git diff --check

      - name: Publish implementation commit
        id: publish
        shell: bash
        run: |
          git rm .github/workflows/implement-pr166.yml .github/workflows/implement-pr166-driver.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Settings to the home carousel"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Unit tests
        id: unit
        run: npm test

      - name: Typecheck
        id: typecheck
        run: npx tsc --noEmit

      - name: Lint
        id: lint
        run: npm run lint

      - name: Install Playwright Chromium
        id: browser
        run: npx playwright install --with-deps chromium

      - name: Mobile carousel browser tests
        id: e2e
        run: npx playwright test e2e/home-carousel.spec.ts --project="Mobile Chrome"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 166 --body "Implemented the Settings home-carousel spec. Validation passed: unit tests, TypeScript, lint, and Mobile Chrome Playwright. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ steps.apply.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          gh pr comment 166 --body "PR 166 implementation harness failed. apply=${APPLY}, install=${INSTALL}, format=${FORMAT}, publish=${PUBLISH}, unit=${UNIT}, typecheck=${TYPECHECK}, lint=${LINT}, browser=${BROWSER}, e2e=${E2E}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
