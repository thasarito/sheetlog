name: Verify Settings Quick Note

on:
  push:
    branches:
      - fix/settings-quicknote-step-amount
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify the regression test fails on the previous Settings editor
        shell: bash
        run: |
          cp src/components/SettingsQuickNoteEditorDrawer.tsx /tmp/SettingsQuickNoteEditorDrawer.tsx
          cp src/components/QuickNotes/QuickNoteFlow.tsx /tmp/QuickNoteFlow.tsx
          git checkout origin/main -- \
            src/components/SettingsQuickNoteEditorDrawer.tsx \
            src/components/QuickNotes/QuickNoteFlow.tsx
          if npm test -- src/components/SettingsQuickNoteEditorDrawer.test.tsx; then
            echo "Regression test unexpectedly passed against the previous Settings editor."
            exit 1
          else
            echo "Regression reproduced against the previous Settings editor."
          fi
          cp /tmp/SettingsQuickNoteEditorDrawer.tsx src/components/SettingsQuickNoteEditorDrawer.tsx
          cp /tmp/QuickNoteFlow.tsx src/components/QuickNotes/QuickNoteFlow.tsx
      - name: Run focused regression tests
        run: npm test -- src/components/SettingsQuickNoteEditorDrawer.test.tsx
      - name: Typecheck Quick Note change
        shell: bash
        run: |
          cat > tsconfig.quicknote.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [
              "src/components/QuickNotes/QuickNoteFlow.tsx",
              "src/components/SettingsQuickNoteEditorDrawer.tsx",
              "src/components/SettingsQuickNoteEditorDrawer.test.tsx",
              "vite-env.d.ts",
              "global.d.ts"
            ],
            "exclude": ["node_modules"]
          }
          JSON
          npx tsc --project tsconfig.quicknote.json --noEmit
          rm tsconfig.quicknote.json
      - name: Lint changed files
        run: >-
          npx biome check
          src/components/QuickNotes/QuickNoteFlow.tsx
          src/components/SettingsQuickNoteEditorDrawer.tsx
          src/components/SettingsQuickNoteEditorDrawer.test.tsx
      - name: Compare the complete suite with main
        shell: bash
        run: |
          set +e
          npm test -- --reporter=json --outputFile=/tmp/branch-vitest.json
          branch_status=$?

          git worktree add --detach /tmp/sheetlog-main origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/sheetlog-main/node_modules
          (
            cd /tmp/sheetlog-main
            npm test -- --reporter=json --outputFile=/tmp/main-vitest.json
          )
          main_status=$?
          set -e

          export BRANCH_STATUS="$branch_status"
          export MAIN_STATUS="$main_status"
          node <<'NODE'
          const fs = require('node:fs');

          const branchPath = '/tmp/branch-vitest.json';
          const mainPath = '/tmp/main-vitest.json';
          for (const path of [branchPath, mainPath]) {
            if (!fs.existsSync(path)) {
              console.error(`Vitest did not produce ${path}`);
              process.exit(1);
            }
          }

          const normalizeFile = (name = 'unknown') =>
            name
              .replace(process.env.GITHUB_WORKSPACE ?? '', '<root>')
              .replace('/tmp/sheetlog-main', '<root>');

          const failures = (path) => {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const names = [];
            for (const file of report.testResults ?? []) {
              let hasFailedAssertion = false;
              for (const test of file.assertionResults ?? []) {
                if (test.status !== 'failed') continue;
                hasFailedAssertion = true;
                names.push(
                  test.fullName || [...(test.ancestorTitles ?? []), test.title].join(' > '),
                );
              }
              if (file.status === 'failed' && !hasFailedAssertion) {
                names.push(`FILE:${normalizeFile(file.name)}`);
              }
            }
            return [...new Set(names)].sort();
          };

          const branchFailures = failures(branchPath);
          const mainFailures = failures(mainPath);
          const mainSet = new Set(mainFailures);
          const branchOnly = branchFailures.filter((name) => !mainSet.has(name));

          console.log(`Branch exit status: ${process.env.BRANCH_STATUS}`);
          console.log(`Main exit status: ${process.env.MAIN_STATUS}`);
          console.log(`Branch failures (${branchFailures.length}):`, branchFailures);
          console.log(`Main failures (${mainFailures.length}):`, mainFailures);

          if (branchOnly.length > 0) {
            console.error('Failures introduced by this branch:', branchOnly);
            process.exit(1);
          }

          console.log('The branch introduces no full-suite failures beyond the main baseline.');
          NODE
