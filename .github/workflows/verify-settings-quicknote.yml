name: Verify Settings Quick Note

on:
  push:
    branches:
      - fix/settings-quicknote-step-amount

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- src/components/SettingsQuickNoteEditorDrawer.test.tsx
