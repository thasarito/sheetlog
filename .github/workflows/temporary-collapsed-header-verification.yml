name: Temporary collapsed header verification

on:
  push:
    branches:
      - feat/collapsed-category-header-band
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run transaction-flow tests
        run: npm test -- src/components/TransactionFlow

      - name: Lint changed source files
        run: >-
          npx eslint
          src/components/TransactionFlow/CategoryStepSheet.tsx
          src/components/TransactionFlow/CategoryStepSheet.test.tsx
          src/components/TransactionFlow/CategoryStepSheet.collapsed-header.test.tsx

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
