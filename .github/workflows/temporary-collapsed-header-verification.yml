name: Temporary collapsed header verification

on:
  pull_request:
    branches:
      - main

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run collapsed header regression
        run: npm test -- src/components/TransactionFlow/CategoryStepSheet.collapsed-header.test.tsx
