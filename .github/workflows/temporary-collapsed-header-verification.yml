name: Temporary collapsed header verification

on:
  push:
    branches:
      - feat/collapsed-category-header-band
  pull_request:
    branches:
      - main

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run category sheet regression tests
        run: >-
          npm test --
          src/components/TransactionFlow/CategoryStepSheet.collapsed-header.test.tsx
          src/components/TransactionFlow/CategoryStepSheet.test.tsx
          src/components/TransactionFlow/CategoryStepSheet.safe-area.test.tsx
          src/components/TransactionFlow/CategoryStepSheet.keyboardClearance.test.tsx
