name: Transaction entry workspace

on:
  push:
    branches:
      - fix/transaction-entry-layout

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source workspace
        run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/sheetlog-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: sheetlog-source
          path: /tmp/sheetlog-source.tgz
          retention-days: 1
