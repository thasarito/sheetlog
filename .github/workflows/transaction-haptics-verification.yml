name: Transaction haptics verification

on:
  push:
    branches:
      - feature/transaction-flow-semantic-haptics
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: transaction-haptics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused haptics tests
        run: >-
          npx vitest run
          src/lib/transactionHaptics.test.ts
          src/components/ui/HapticSelectionButton.test.tsx
          src/components/ui/AnimatedTabs.haptics.test.tsx
          src/components/Picker.haptics.test.tsx
          src/components/CategoryGrid.haptics.test.tsx
          src/components/CategoryQuickNoteMenu/useCategoryQuickNoteMenu.haptics.test.tsx
          src/components/DateScroller.haptics.test.tsx
          src/components/TransactionFlow/StepReceipt.haptics.test.tsx
      - name: Full test suite
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
