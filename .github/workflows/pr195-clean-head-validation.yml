name: PR 195 Clean Head Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the exact cleaned PR head
        uses: actions/checkout@v4
        with:
          ref: baa47a09eb6e2c64b5dd03e55a62387ea68adcbf
          persist-credentials: false
      - name: Verify exact commit
        run: test "$(git rev-parse HEAD)" = "baa47a09eb6e2c64b5dd03e55a62387ea68adcbf"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full unit and component suite
        run: npm test
      - name: Changed-file Biome check
        run: >-
          npx biome check
          src/lib/settingsControlCenter.ts
          src/lib/settingsControlCenter.test.ts
          src/hooks/useAccountMutations.ts
          src/hooks/useCategoryMutations.ts
          src/hooks/useQuickNotes.ts
          src/hooks/useSettingsCollectionMutations.test.tsx
          src/hooks/useReplaceQuickNotesConfig.test.tsx
          src/components/SettingsControlSection.tsx
          src/components/SettingsControlSection.test.tsx
          src/components/SettingsItemEditorDrawer.tsx
          src/components/SettingsItemEditorDrawer.test.tsx
          src/components/SettingsQuickNoteEditorDrawer.tsx
          src/components/SettingsQuickNoteEditorDrawer.test.tsx
          src/components/SettingsView.tsx
          src/components/SettingsViewContent.tsx
          src/components/SettingsView.test.tsx
          src/components/SettingsView.theme.test.tsx
          src/components/TransactionFlow/HomeDashboardCarousel.tsx
          src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
          e2e/home-carousel.spec.ts
      - name: TypeScript diagnostics (reject new errors)
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/pr195-tsc.log
          set -e
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const output = readFileSync('/tmp/pr195-tsc.log', 'utf8');
          const diagnostics = output
            .split('\n')
            .filter((line) => /error TS\d+:/.test(line));
          const allowed = [
            'src/components/TransactionFlow/CategoryStepSheetKeyboard.test.tsx(119,9): error TS2322:',
            'src/components/TransactionFlow/TransactionHistoryDock.tsx(55,5): error TS2352:',
          ];
          const unexpected = diagnostics.filter(
            (line) => !allowed.some((prefix) => line.startsWith(prefix)),
          );
          if (unexpected.length > 0) {
            console.error('Unexpected TypeScript diagnostics:\n' + unexpected.join('\n'));
            process.exit(1);
          }
          console.log(
            diagnostics.length === 0
              ? 'TypeScript passed with no diagnostics.'
              : `Only documented baseline diagnostics remain (${diagnostics.length}).`,
          );
          NODE
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Mobile Control Center regression
        env:
          VITE_DEV_MODE: "true"
          VITE_GOOGLE_MAPS_API_KEY: e2e-key
        run: >-
          npx playwright test e2e/home-carousel.spec.ts
          --project="Mobile Chrome"
          --grep="expandable Control Center"
          --retries=0
