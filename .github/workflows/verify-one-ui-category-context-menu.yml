name: Verify One UI category context menu

on:
  push:
    branches:
      - feat/one-ui-category-context-menu
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint changed files
        run: >-
          npx biome check
          src/components/CategoryQuickNoteMenu/index.tsx
          src/components/CategoryQuickNoteMenu/useCategoryQuickNoteMenu.ts
          src/components/TransactionFlow/StepCategory.tsx
          src/components/TransactionFlow/StepCategory.test.tsx
          src/components/TransactionFlow/StepCategory.contextMenu.test.tsx
      - name: Typecheck changed surface
        run: |
          cat > tsconfig.feature.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [],
            "files": [
              "vite-env.d.ts",
              "global.d.ts",
              "src/components/CategoryQuickNoteMenu/index.tsx",
              "src/components/CategoryQuickNoteMenu/useCategoryQuickNoteMenu.ts",
              "src/components/TransactionFlow/StepCategory.tsx",
              "src/components/TransactionFlow/StepCategory.test.tsx",
              "src/components/TransactionFlow/StepCategory.contextMenu.test.tsx"
            ]
          }
          JSON
          npx tsc -p tsconfig.feature.json --noEmit
      - run: npm test
