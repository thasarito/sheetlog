name: Verify tethered category menu

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint changed surface
        run: >-
          npx biome check
          src/components/CategoryQuickNoteMenu/index.tsx
          src/components/CategoryQuickNoteMenu/index.test.tsx
          src/components/CategoryQuickNoteMenu/useCategoryQuickNoteMenu.ts
          src/components/CategoryQuickNoteMenu/useCategoryQuickNoteMenu.presentation.test.tsx
          src/components/TransactionFlow/StepCategory.tsx
          src/components/TransactionFlow/StepCategory.test.tsx
          src/components/TransactionFlow/StepCategory.contextMenu.test.tsx
          src/styles/index.ts
          src/styles/category-quick-note-menu.css
      - name: Typecheck changed surface
        run: |
          cat > tsconfig.feature.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [],
            "files": [
              "vite-env.d.ts",
              "global.d.ts",
              "src/components/CategoryQuickNoteMenu/index.tsx",
              "src/components/CategoryQuickNoteMenu/index.test.tsx",
              "src/components/CategoryQuickNoteMenu/useCategoryQuickNoteMenu.ts",
              "src/components/CategoryQuickNoteMenu/useCategoryQuickNoteMenu.presentation.test.tsx",
              "src/components/TransactionFlow/StepCategory.tsx",
              "src/components/TransactionFlow/StepCategory.test.tsx",
              "src/components/TransactionFlow/StepCategory.contextMenu.test.tsx",
              "src/styles/index.ts"
            ]
          }
          JSON
          npx tsc -p tsconfig.feature.json --noEmit
      - name: Focused interaction regressions
        run: >-
          npx vitest run
          src/components/CategoryQuickNoteMenu/index.test.tsx
          src/components/CategoryQuickNoteMenu/useCategoryQuickNoteMenu.presentation.test.tsx
          src/components/TransactionFlow/StepCategory.contextMenu.test.tsx
          src/components/TransactionFlow/StepCategory.test.tsx
          src/components/TransactionFlow/StepCategory.carousel.test.tsx
          src/components/CategoryGrid.test.tsx
          src/components/CategoryGrid.longPressSelection.test.tsx
      - name: Production build
        run: npm run build
      - name: Full suite baseline comparison
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test > /tmp/vitest.log 2>&1
          status=$?
          tail -n 120 /tmp/vitest.log
          exit $status
