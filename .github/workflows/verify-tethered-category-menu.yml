name: Verify tethered category menu

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tethered menu presentation tests
        run: >-
          npx vitest run
          src/components/CategoryQuickNoteMenu/index.test.tsx
          src/components/CategoryQuickNoteMenu/useCategoryQuickNoteMenu.presentation.test.tsx
