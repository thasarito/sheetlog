name: Verify One UI baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full test suite
        shell: bash
        run: |
          set +e
          npm test > /tmp/vitest.log 2>&1
          status=$?
          tail -n 300 /tmp/vitest.log
          exit $status
