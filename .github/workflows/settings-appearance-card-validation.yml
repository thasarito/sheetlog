name: Settings Appearance Card Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-control-center-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add the always-visible Appearance card
        run: |
          node scripts/patch-settings-appearance-card.mjs
          npx biome check --write \
            src/components/SettingsViewContent.tsx \
            src/components/SettingsView.test.tsx
      - name: Commit Appearance card
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/components/SettingsViewContent.tsx \
              src/components/SettingsView.test.tsx
            git commit -m "feat: add always-visible Settings appearance card"
            git push origin HEAD:feat/settings-control-center-navigation
          fi
      - name: Settings and Theme regressions
        run: >-
          npm test --
          src/components/SettingsView.test.tsx
          src/components/SettingsView.theme.test.tsx
          src/components/ThemeSetting.test.tsx
          src/lib/theme.test.ts
          src/app/providers/theme/ThemeProvider.test.tsx
      - name: Non-baseline repository suite
        run: >-
          npx vitest run
          --exclude src/components/TransactionFlow/CategoryStepSheet.test.tsx
          --exclude src/components/TransactionFlow/CategoryStepSheetKeyboard.test.tsx
      - name: Changed-file Biome check
        run: >-
          npx biome check
          src/components/SettingsViewContent.tsx
          src/components/SettingsView.test.tsx
      - name: TypeScript diagnostics (reject new errors)
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/settings-appearance-tsc.log
          set -e
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const output = readFileSync('/tmp/settings-appearance-tsc.log', 'utf8');
          const diagnostics = output
            .split('\n')
            .filter((line) => /error TS\d+:/.test(line));
          const allowed = [
            'src/components/TransactionFlow/CategoryStepSheetKeyboard.test.tsx(119,9): error TS2322:',
            'src/components/TransactionFlow/TransactionHistoryDock.tsx(55,5): error TS2352:',
          ];
          const unexpected = diagnostics.filter(
            (line) => !allowed.some((prefix) => line.startsWith(prefix)),
          );
          if (unexpected.length > 0) {
            console.error('Unexpected TypeScript diagnostics:\n' + unexpected.join('\n'));
            process.exit(1);
          }
          console.log(
            diagnostics.length === 0
              ? 'TypeScript passed with no diagnostics.'
              : `Only documented baseline diagnostics remain (${diagnostics.length}).`,
          );
          NODE
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Mobile Control Center regression
        env:
          VITE_DEV_MODE: "true"
          VITE_GOOGLE_MAPS_API_KEY: e2e-key
        run: >-
          npx playwright test e2e/home-carousel.spec.ts
          --project="Mobile Chrome"
          --grep="expandable Control Center"
          --retries=0
