name: Transaction search carousel lag

on:
  pull_request:
    branches:
      - main

concurrency:
  group: transaction-search-carousel-lag-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run carousel, dock, and sheet tests
        run: >-
          npx vitest run
          src/components/TransactionFlow/TransactionHistoryDock.motion.test.tsx
          src/components/TransactionFlow/TransactionHistoryView.test.tsx
          src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
          src/components/TransactionFlow/CategoryStepSheetKeyboard.test.tsx
          src/components/TransactionFlow/CategoryStepSheet.test.tsx

      - name: Lint changed files
        run: >-
          npx biome check
          src/components/TransactionFlow/TransactionHistoryDock.tsx
          src/components/TransactionFlow/TransactionHistoryDock.motion.test.tsx
          src/components/TransactionFlow/CategoryStepSheetKeyboard.test.tsx
          src/components/TransactionFlow/CategoryStepSheet.test.tsx
          e2e/home-carousel-native-scroll.spec.ts
          src/styles/globals.css

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run full unit suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run native carousel browser test
        env:
          VITE_DEV_MODE: "true"
        run: >-
          npx playwright test
          e2e/home-carousel-native-scroll.spec.ts
          --project="Mobile Chrome"
          --retries=0
