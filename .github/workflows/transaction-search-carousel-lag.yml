name: Transaction search carousel lag

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run carousel and transaction dock tests
        run: >-
          npx vitest run
          src/components/TransactionFlow/TransactionHistoryDock.motion.test.tsx
          src/components/TransactionFlow/TransactionHistoryView.test.tsx
          src/components/TransactionFlow/HomeDashboardCarousel.test.tsx

      - name: Lint changed files
        run: >-
          npx biome check
          src/components/TransactionFlow/TransactionHistoryDock.tsx
          src/components/TransactionFlow/TransactionHistoryDock.motion.test.tsx
          e2e/home-carousel-native-scroll.spec.ts
          src/styles/globals.css

      - name: Type-check
        run: npx tsc --noEmit

  full-suite-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full unit suite
        run: npm test

      - name: Build
        run: npm run build

  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run native carousel browser test
        env:
          VITE_DEV_MODE: "true"
        run: >-
          npx playwright test
          e2e/home-carousel-native-scroll.spec.ts
          --project="Mobile Chrome"
          --retries=0
