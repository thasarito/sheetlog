name: Transaction search carousel lag

on:
  push:
    branches:
      - fix/transaction-search-carousel-lag

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run transaction dock regression test when present
        run: |
          if [ -f src/components/TransactionFlow/TransactionHistoryDock.motion.test.tsx ]; then
            npx vitest run src/components/TransactionFlow/TransactionHistoryDock.motion.test.tsx
          else
            echo "Regression test has not been added yet."
          fi
