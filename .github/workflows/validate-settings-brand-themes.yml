name: Validate settings brand themes

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/validate-settings-brand-themes.yml'
      - 'src/components/**'
      - 'src/styles/globals.css'
      - 'src/theme/**'
      - 'docs/superpowers/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused Settings and theme tests
        run: >-
          npm test --
          src/theme/themeConfig.test.ts
          src/theme/themeBoundaries.test.ts
          src/components/ThemeSetting.test.tsx
          src/components/SettingsControlSection.test.tsx
          src/components/settingsIconBadges.test.tsx
          src/components/SettingsView.test.tsx
          src/components/SettingsView.theme.test.tsx
          src/components/AnalyticsBaseCurrencySetting.test.tsx
          src/components/AnalyticsBigSpendingThresholdSetting.test.tsx
          src/components/AnalyticsSyncSetting.test.tsx

      - name: Run scoped lint
        run: >-
          npx biome check
          src/theme/themeConfig.ts
          src/theme/themeConfig.test.ts
          src/components/SettingsIconBadge.tsx
          src/components/ThemeSetting.tsx
          src/components/ThemeSetting.test.tsx
          src/components/SettingsControlSection.tsx
          src/components/SettingsControlSection.test.tsx
          src/components/settingsIconBadges.test.tsx
          src/components/AnalyticsBaseCurrencySetting.tsx
          src/components/AnalyticsBigSpendingThresholdSetting.tsx
          src/components/AnalyticsSyncSetting.tsx
          src/styles/globals.css

      - name: Run scoped typecheck
        run: |
          cat > .tsconfig.settings-ci.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [],
            "files": [
              "src/theme/themeConfig.ts",
              "src/components/SettingsIconBadge.tsx",
              "src/components/ThemeSetting.tsx",
              "src/components/SettingsControlSection.tsx",
              "src/components/AnalyticsBaseCurrencySetting.tsx",
              "src/components/AnalyticsBigSpendingThresholdSetting.tsx",
              "src/components/AnalyticsSyncSetting.tsx"
            ]
          }
          JSON
          npx tsc --project .tsconfig.settings-ci.json --noEmit
          rm .tsconfig.settings-ci.json

      - name: Run production build
        run: npm run build

      - name: Observe the unchanged repository typecheck baseline
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Observe the unchanged repository lint baseline
        continue-on-error: true
        run: npm run lint

      - name: Observe the unchanged full-suite baseline
        continue-on-error: true
        run: npm test
