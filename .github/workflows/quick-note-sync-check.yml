name: Quick Note sync verification

on:
  push:
    branches:
      - fix/quick-note-color-sync-divergence

permissions:
  contents: read

jobs:
  targeted-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- src/lib/googleSettings.quickNoteColorRange.test.ts
