name: Native dashboard scroll-snap validation

on:
  push:
    branches:
      - refactor/native-dashboard-scroll-snap
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lockfiles:
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/native-dashboard-scroll-snap'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/native-dashboard-scroll-snap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove Embla once and synchronize lockfiles
        run: |
          if ! grep -q '"embla-carousel-react"' package.json; then
            echo "Embla is already absent"
            exit 0
          fi
          npm uninstall embla-carousel-react --ignore-scripts
          npx --yes pnpm@10.15.0 install --lockfile-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json pnpm-lock.yaml
          git commit -m "chore: remove Embla dashboard dependency"
          git push origin HEAD:refactor/native-dashboard-scroll-snap

  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run src/components/Header.test.tsx src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
      - run: npx tsc --noEmit
      - run: npm run lint
