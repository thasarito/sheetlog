name: Native dashboard scroll-snap validation

on:
  push:
    branches:
      - refactor/native-dashboard-scroll-snap
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: HUSKY=0 npm ci
      - name: Verify Embla is absent
        run: |
          if grep -R "embla-carousel" package.json package-lock.json pnpm-lock.yaml src e2e; then
            echo "Found a stale Embla reference"
            exit 1
          fi
      - name: Focused pager tests
        run: npx vitest run src/components/Header.test.tsx src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint changed implementation files
        run: >-
          npx biome check
          src/components/DashboardTitleReel.tsx
          src/components/Header.tsx
          src/components/Header.test.tsx
          src/components/TransactionFlow/HomeDashboardCarousel.tsx
          src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
          e2e/home-carousel-native-scroll.spec.ts
      - name: Compare unrelated category-sheet failures with main
        shell: bash
        run: |
          set +e
          NO_COLOR=1 npx vitest run \
            src/components/TransactionFlow/CategoryStepSheet.test.tsx \
            src/components/TransactionFlow/CategoryStepSheetKeyboard.test.tsx \
            --reporter=json --outputFile=/tmp/pr-category-sheet.json
          pr_status=$?

          git worktree add --detach /tmp/sheetlog-main origin/main
          (
            cd /tmp/sheetlog-main
            HUSKY=0 npm ci
            NO_COLOR=1 npx vitest run \
              src/components/TransactionFlow/CategoryStepSheet.test.tsx \
              src/components/TransactionFlow/CategoryStepSheetKeyboard.test.tsx \
              --reporter=json --outputFile=/tmp/main-category-sheet.json
          )
          main_status=$?
          set -e

          PR_STATUS="$pr_status" MAIN_STATUS="$main_status" node <<'NODE'
          const fs = require("node:fs");

          function failedTests(path) {
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            return (report.testResults ?? [])
              .flatMap((file) => file.assertionResults ?? file.testResults ?? [])
              .filter((test) => test.status === "failed" || test.state === "fail")
              .map((test) =>
                [...(test.ancestorTitles ?? []), test.title ?? test.name]
                  .filter(Boolean)
                  .join(" > "),
              )
              .sort();
          }

          const prFailures = failedTests("/tmp/pr-category-sheet.json");
          const mainFailures = failedTests("/tmp/main-category-sheet.json");
          console.log("PR category-sheet failures:", prFailures);
          console.log("main category-sheet failures:", mainFailures);

          if (JSON.stringify(prFailures) !== JSON.stringify(mainFailures)) {
            console.error("The PR changes the category-sheet failure set.");
            process.exit(1);
          }

          if (process.env.PR_STATUS !== process.env.MAIN_STATUS) {
            console.error(
              `The PR/main exit codes differ: ${process.env.PR_STATUS} vs ${process.env.MAIN_STATUS}`,
            );
            process.exit(1);
          }
          NODE
      - name: Full unit suite excluding unchanged baseline failures
        run: >-
          npx vitest run
          --exclude=src/components/TransactionFlow/CategoryStepSheet.test.tsx
          --exclude=src/components/TransactionFlow/CategoryStepSheetKeyboard.test.tsx
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile Chrome carousel coverage
        run: >-
          VITE_DEV_MODE=true npx playwright test
          e2e/home-carousel.spec.ts
          e2e/home-carousel-native-scroll.spec.ts
          --project="Mobile Chrome"
          --retries=0
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
