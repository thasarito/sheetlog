name: Native dashboard scroll-snap validation

on:
  push:
    branches:
      - refactor/native-dashboard-scroll-snap
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/native-dashboard-scroll-snap'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/native-dashboard-scroll-snap
          fetch-depth: 0
      - name: Remove the obsolete Embla test mock once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/TransactionFlow/HomeDashboardCarousel.test.tsx')
          text = path.read_text()
          marker = 'const legacyEmbla = vi.hoisted'
          if marker not in text:
              raise SystemExit(0)
          start = text.index(marker)
          end = text.index('const transactionViewCalls')
          text = text[:start] + text[end:]
          text = text.replace('    legacyEmbla.options = null;\n', '')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
          git commit -m "test: remove obsolete Embla harness"
          git push origin HEAD:refactor/native-dashboard-scroll-snap

  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run src/components/Header.test.tsx src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
      - run: npx tsc --noEmit
      - name: Lint changed implementation files
        run: >-
          npx biome check
          src/components/DashboardTitleReel.tsx
          src/components/Header.tsx
          src/components/Header.test.tsx
          src/components/TransactionFlow/HomeDashboardCarousel.tsx
          src/components/TransactionFlow/HomeDashboardCarousel.test.tsx
